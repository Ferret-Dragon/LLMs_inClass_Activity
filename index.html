<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Financer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Financer</a>
  </header>

  <main id="app" class="page">
    <section class="card" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a transaction</h2>
      <form id="transaction-form" class="form-row">
        <label>
          <span>Description</span>
          <input name="description" type="text" maxlength="80" required placeholder="e.g. Weekly shop">
        </label>
        <label>
          <span>Amount</span>
          <input name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00">
        </label>
        <label>
          <span>Category</span>
          <select name="categoryId" required></select>
        </label>
        <label>
          <span>Date</span>
          <input name="date" type="date" required>
        </label>
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
    </section>

    <section class="card" id="category-box" aria-labelledby="category-heading">
      <div class="card-head">
        <h2 id="category-heading">Categories</h2>
      </div>
      <ul id="category-list" class="category-list"></ul>
      <p id="category-empty" class="empty" hidden>No categories yet.</p>
    </section>

    <section class="card" aria-labelledby="list-heading">
      <div class="card-head">
        <h2 id="list-heading">Recent transactions</h2>
        <button type="button" id="toggle-all" class="btn btn-ghost" hidden></button>
      </div>
      <ul id="transaction-list" class="transaction-list"></ul>
      <p id="transaction-empty" class="empty" hidden>No transactions yet. Add your first one above.</p>
      <p id="transaction-total" class="total" hidden></p>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
